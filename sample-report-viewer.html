    .brand-home{display:block;color:inherit;text-decoration:none}.sample-shell{max-width:1320px;margin:0 auto;padding:28px 32px 48px}.sample-nav-shell{margin:0 0 24px;border:1px solid rgba(183,199,207,.9);border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 18px 45px rgba(16,45,70,.08);overflow:hidden}

</div><script>addEventListener('load',()=>{setTimeout(()=>scrollTo(0,0),0);const frame=document.querySelector('.sample-viewer');const sync=()=>{try{const links=[...frame.contentDocument.querySelectorAll('a')],analysis=links.find(a=>a.textContent.trim()==='Sample Analysis'),proforma=links.find(a=>a.textContent.trim()==='Sample Pro Forma');analysis?.remove();if(proforma){proforma.href='sample-pro-forma-viewer.html';proforma.target='_top';}}catch(_e){}};frame?.addEventListener('load',sync);sync()});</script><script src="sample-property-card-nav.js?v=3"></script><script src="page-refresh-top.js?v=8"></script><script src="compliance-footer.js?v=3"></script></body></html>
