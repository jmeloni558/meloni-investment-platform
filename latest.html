<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading Investment Property Analyzer…</title>
<style>body{font-family:Arial,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f7fa;color:#344054}.loading{padding:24px;text-align:center}.loading b{display:block;margin-bottom:8px;color:#174f83}</style>
</head>
<body>
<div class="loading"><b>Investment Property Analyzer</b>Loading the latest build…</div>
<script>
(async()=>{
  const BUILD='20260818-1607-vacancy-style-force';
  try{
    const r=await fetch('./index.html?build='+encodeURIComponent(BUILD),{cache:'no-store'});
    if(!r.ok)throw new Error('Unable to load application');
    let html=await r.text();
    const assets=['styles.css','app.js','cloud.js','stage5.js','stage5-cloud.js'];
    for(const asset of assets){
      html=html.split('"'+asset+'"').join('"'+asset+'?build='+BUILD+'"');
    }
    html=html.replace('</head>','<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"></head>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><b>Unable to load the latest build</b>'+String(e.message||e)+'</div>';
  }
})();
</script>
</body>
</html>
